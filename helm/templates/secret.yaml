{{- include "draftforge.previewGuard" . -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "draftforge.fullname" . }}-env
  labels:
    {{- include "draftforge.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "secrets.djangoSecretKey is required when secrets.create is true" .Values.secrets.djangoSecretKey | quote }}
  INTERNAL_SERVICE_TOKEN: {{ required "secrets.internalServiceToken is required when secrets.create is true" .Values.secrets.internalServiceToken | quote }}
  {{- with .Values.secrets.dotaLobbyApiKey }}
  DOTA_LOBBY_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.dotaLobbyWebhookSecret }}
  DOTA_LOBBY_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
