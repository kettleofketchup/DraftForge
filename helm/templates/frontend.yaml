apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "draftforge.fullname" . }}-frontend
  labels:
    {{- include "draftforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.frontend.replicas }}
  progressDeadlineSeconds: {{ .Values.frontend.progressDeadlineSeconds }}
  strategy:
    # The old UI keeps serving through the image gap and after a failed build.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "draftforge.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "draftforge.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      annotations:
        {{- include "draftforge.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "draftforge.podCommon" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "draftforge.image" (dict "root" . "img" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            {{- include "draftforge.envFrom" . | nindent 12 }}
          # Container env overrides envFrom. The image is the prod runtime build;
          # NODE_ENV=test from the shared ConfigMap would load React's dev server bundle.
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: SSR_API_URL
              value: http://backend:8000/api
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
          resources:
            {{- include "draftforge.requireResources" (dict "name" "frontend" "res" .Values.frontend.resources) | nindent 12 }}
          securityContext:
            {{- include "draftforge.containerSecurity" (list 1000 1000) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Fixed name, like backend and redis: one release per namespace.
  name: frontend
  labels:
    {{- include "draftforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    {{- include "draftforge.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
