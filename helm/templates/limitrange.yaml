{{- include "draftforge.previewGuard" . -}}
{{- if .Values.preview.enabled }}
{{- $lr := .Values.preview.limitRange }}
apiVersion: v1
kind: LimitRange
metadata:
  name: draftforge-preview-limits
  labels:
    {{- include "draftforge.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Set by the deploying cluster. Every chart container sets explicit resources,
  # so default/defaultRequest are a safety net and max caps each container.
  limits:
    - type: Container
      default:
        {{- toYaml $lr.default | nindent 8 }}
      defaultRequest:
        {{- toYaml $lr.defaultRequest | nindent 8 }}
      max:
        {{- toYaml $lr.max | nindent 8 }}
{{- end }}
