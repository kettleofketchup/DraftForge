suite: default (prod-shaped) values
values:
  - fixtures/prod-values.yaml
templates:
  - templates/serviceaccount.yaml
  - templates/secret.yaml
  - templates/configmap-env.yaml
  - templates/pvc.yaml
  - templates/backend.yaml
  - templates/frontend.yaml
  - templates/redis.yaml
  - templates/celery-worker.yaml
  - templates/celery-beat.yaml
  - templates/discord-bot.yaml
  - templates/namespace.yaml
  - templates/resourcequota.yaml
  - templates/limitrange.yaml
  - templates/networkpolicy.yaml
tests:
  - it: renders the PVC draftforge-data
    template: templates/pvc.yaml
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: PersistentVolumeClaim}
      - equal: {path: metadata.name, value: draftforge-data}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "0"}
      # Empty storageClass: the field is omitted and the cluster default applies.
      - notExists: {path: spec.storageClassName}
      - equal: {path: spec.accessModes, value: [ReadWriteOnce]}
      - equal: {path: spec.resources.requests.storage, value: 2Gi}

  - it: renders no PVC when persistence is disabled
    template: templates/pvc.yaml
    set:
      persistence.enabled: false
    asserts:
      - hasDocuments: {count: 0}

  - it: renders the env ConfigMap with the in-cluster wiring
    template: templates/configmap-env.yaml
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: ConfigMap}
      - equal: {path: metadata.name, value: draftforge-env}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "0"}
      - equal: {path: data.CELERY_BROKER_URL, value: "redis://redis:6379/3"}
      - equal: {path: data.CELERY_RESULT_BACKEND, value: "redis://redis:6379/3"}
      - equal: {path: data.REDIS_HOST, value: redis}
      - equal: {path: data.SQLITE_PATH, value: /data/db.sqlite3}
      - equal: {path: data.EXTRA_ALLOWED_HOSTS, value: dota.kettle.sh}
      - equal: {path: data.EXTRA_CSRF_TRUSTED_ORIGINS, value: "https://dota.kettle.sh"}
      - equal: {path: data.TRUST_X_FORWARDED_PROTO, value: "true"}
      - equal: {path: data.DEPLOY_VERSION, value: "0.9.70"}
      - equal: {path: data.NODE_ENV, value: production}
      - equal: {path: data.INTERNAL_API_URL, value: "http://backend:8000/api/internal"}
      - equal: {path: data.API_BASE_URL, value: "http://backend:8000/api"}
      - equal: {path: data.SITE_URL, value: "https://dota.kettle.sh"}
      - equal: {path: data.DEBUG, value: "false"}

  - it: sets DEPLOY_VERSION to the rendered image tag
    template: templates/configmap-env.yaml
    set:
      image.tag: pr-7-abcdef1
    asserts:
      - equal: {path: data.DEPLOY_VERSION, value: pr-7-abcdef1}

  - it: adds env.extra keys next to the chart keys
    template: templates/configmap-env.yaml
    set:
      env.extra:
        FOO: bar
    asserts:
      - equal: {path: data.FOO, value: bar}
      - equal: {path: data.TEST, value: "false"}

  - it: renders no Secret when secrets.create is false
    template: templates/secret.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: renders the env Secret when secrets.create is true
    template: templates/secret.yaml
    set:
      secrets.create: true
      secrets.djangoSecretKey: test-key
      secrets.internalServiceToken: test-token
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: Secret}
      - equal: {path: metadata.name, value: draftforge-env}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "0"}
      - equal: {path: stringData.DJANGO_SECRET_KEY, value: test-key}
      - equal: {path: stringData.INTERNAL_SERVICE_TOKEN, value: test-token}

  - it: renders the ServiceAccount without an API token
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: ServiceAccount}
      - equal: {path: metadata.name, value: draftforge}
      - equal: {path: automountServiceAccountToken, value: false}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "0"}

  - it: renders the backend Deployment with a Recreate strategy (persistent SQLite)
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: metadata.name, value: draftforge-backend}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "1"}
      - equal: {path: spec.replicas, value: 1}
      - equal: {path: spec.progressDeadlineSeconds, value: 900}
      - equal: {path: spec.strategy.type, value: Recreate}
      - notExists: {path: spec.strategy.rollingUpdate}
      - equal:
          path: spec.selector.matchLabels
          value: {app.kubernetes.io/name: draftforge, app.kubernetes.io/component: backend}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].image", value: "ghcr.io/kettleofketchup/draftforge/backend:0.9.70"}
      - equal: {path: "spec.template.spec.volumes[?(@.name == \"data\")].persistentVolumeClaim.claimName", value: draftforge-data}
      - notExists: {path: "spec.template.spec.volumes[?(@.name == \"data\")].emptyDir"}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].volumeMounts", value: [{name: data, mountPath: /data}]}

  - it: gives the backend the startup, readiness and liveness probes
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: "spec.template.spec.containers[?(@.name == \"backend\")].startupProbe"
          value:
            httpGet: {path: /api/, port: 8000, httpHeaders: [{name: Host, value: backend}]}
            periodSeconds: 5
            failureThreshold: 60
      - equal:
          path: "spec.template.spec.containers[?(@.name == \"backend\")].readinessProbe"
          value:
            httpGet: {path: /api/, port: 8000, httpHeaders: [{name: Host, value: backend}]}
            periodSeconds: 10
      - equal:
          path: "spec.template.spec.containers[?(@.name == \"backend\")].livenessProbe"
          value:
            tcpSocket: {port: 8000}
            periodSeconds: 20
            failureThreshold: 6

  - it: rolls the backend with surge and an emptyDir when persistence is disabled
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    set:
      persistence.enabled: false
    asserts:
      - equal: {path: spec.strategy.type, value: RollingUpdate}
      - equal: {path: spec.strategy.rollingUpdate.maxSurge, value: 1}
      - equal: {path: spec.strategy.rollingUpdate.maxUnavailable, value: 0}
      - equal: {path: "spec.template.spec.volumes[?(@.name == \"data\")].emptyDir.sizeLimit", value: 1Gi}
      - notExists: {path: "spec.template.spec.volumes[?(@.name == \"data\")].persistentVolumeClaim"}

  - it: renders the Service backend on 8000
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Service}
    asserts:
      - equal: {path: metadata.name, value: backend}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "0"}
      - equal: {path: "spec.ports[0].port", value: 8000}
      - equal:
          path: spec.selector
          value: {app.kubernetes.io/name: draftforge, app.kubernetes.io/component: backend}

  - it: annotates the backend pod with the preview commit only when set
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    set:
      previewCommit: "0123456789abcdef0123456789abcdef01234567"
    asserts:
      - equal: {path: "spec.template.metadata.annotations[\"draftforge.kettle.sh/commit\"]", value: "0123456789abcdef0123456789abcdef01234567"}
      - exists: {path: "spec.template.metadata.annotations[\"checksum/config\"]"}

  - it: renders the frontend Deployment with a surge rollout
    template: templates/frontend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: metadata.name, value: draftforge-frontend}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "1"}
      - equal: {path: spec.progressDeadlineSeconds, value: 300}
      - equal: {path: spec.strategy.type, value: RollingUpdate}
      - equal: {path: spec.strategy.rollingUpdate.maxSurge, value: 1}
      - equal: {path: spec.strategy.rollingUpdate.maxUnavailable, value: 0}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"frontend\")].image", value: "ghcr.io/kettleofketchup/draftforge/frontend:0.9.70"}
      - contains:
          path: "spec.template.spec.containers[?(@.name == \"frontend\")].env"
          content: {name: NODE_ENV, value: production}
      - contains:
          path: "spec.template.spec.containers[?(@.name == \"frontend\")].env"
          content: {name: PORT, value: "3000"}
      - contains:
          path: "spec.template.spec.containers[?(@.name == \"frontend\")].env"
          content: {name: SSR_API_URL, value: "http://backend:8000/api"}

  - it: renders the Service frontend on 3000
    template: templates/frontend.yaml
    documentSelector: {path: kind, value: Service}
    asserts:
      - equal: {path: metadata.name, value: frontend}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "0"}
      - equal: {path: "spec.ports[0].port", value: 3000}
      - equal:
          path: spec.selector
          value: {app.kubernetes.io/name: draftforge, app.kubernetes.io/component: frontend}

  - it: renders redis as a single Recreate instance without persistence
    template: templates/redis.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: metadata.name, value: draftforge-redis}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "1"}
      - equal: {path: spec.strategy.type, value: Recreate}
      - equal: {path: spec.progressDeadlineSeconds, value: 300}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].image", value: "redis:8.2.1-alpine"}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].args", value: ["--save", "", "--appendonly", "no"]}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].securityContext.runAsUser", value: 999}
      - equal: {path: "spec.template.spec.volumes[?(@.name == \"data\")].emptyDir", value: {sizeLimit: 256Mi}}
      - notExists: {path: spec.template.metadata.annotations}

  - it: renders the Service redis on 6379
    template: templates/redis.yaml
    documentSelector: {path: kind, value: Service}
    asserts:
      - equal: {path: metadata.name, value: redis}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", value: "0"}
      - equal: {path: "spec.ports[0].port", value: 6379}
      - equal:
          path: spec.selector
          value: {app.kubernetes.io/name: draftforge, app.kubernetes.io/component: redis}

  - it: renders no redis when redis is disabled
    template: templates/redis.yaml
    set:
      redis.enabled: false
    asserts:
      - hasDocuments: {count: 0}

  - it: takes each Deployment's progressDeadlineSeconds from its component value
    set:
      backend.progressDeadlineSeconds: 901
      frontend.progressDeadlineSeconds: 302
      redis.progressDeadlineSeconds: 303
    asserts:
      - equal: {path: spec.progressDeadlineSeconds, value: 901}
        template: templates/backend.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: spec.progressDeadlineSeconds, value: 302}
        template: templates/frontend.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: spec.progressDeadlineSeconds, value: 303}
        template: templates/redis.yaml
        documentSelector: {path: kind, value: Deployment}

  - it: renders no Namespace, ResourceQuota, LimitRange or NetworkPolicy
    asserts:
      - hasDocuments: {count: 0}
        template: templates/namespace.yaml
      - hasDocuments: {count: 0}
        template: templates/resourcequota.yaml
      - hasDocuments: {count: 0}
        template: templates/limitrange.yaml
      - hasDocuments: {count: 0}
        template: templates/networkpolicy.yaml

  - it: renders no Job of any kind
    # No template: runs on every listed template and every document it renders.
    asserts:
      - isKind: {of: Job}
        not: true
        documentSelector: {path: metadata.name, matchMany: true, skipEmptyTemplates: true}

  - it: renders no Job of any kind when the env Secret is created
    set:
      secrets.create: true
      secrets.djangoSecretKey: test-key
      secrets.internalServiceToken: test-token
    asserts:
      - isKind: {of: Job}
        not: true
        documentSelector: {path: metadata.name, matchMany: true, skipEmptyTemplates: true}

  - it: renders the PVC with an explicit storageClass when one is set
    template: templates/pvc.yaml
    set:
      persistence.storageClass: fast-rwo
    asserts:
      - equal: {path: spec.storageClassName, value: fast-rwo}
