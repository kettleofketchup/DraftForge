suite: backend-only secrets (backend.extraEnvSecrets)
values:
  - fixtures/prod-values.yaml
set:
  backend.extraEnvSecrets: [draftforge-backend-only]
templates:
  - templates/configmap-env.yaml
  - templates/secret.yaml
  - templates/backend.yaml
  - templates/frontend.yaml
  - templates/celery-worker.yaml
  - templates/celery-beat.yaml
  - templates/discord-bot.yaml
tests:
  - it: loads the backend-only Secret into the backend container after the shared list
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: "spec.template.spec.containers[?(@.name == \"backend\")].envFrom"
          content: {secretRef: {name: draftforge-backend-only}}
      - contains:
          path: "spec.template.spec.containers[?(@.name == \"backend\")].envFrom"
          content: {secretRef: {name: draftforge-prod-env}}

  - it: keeps the backend-only Secret out of the migrate init container
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notContains:
          path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].envFrom"
          content: {secretRef: {name: draftforge-backend-only}}

  - it: keeps the backend-only Secret out of the frontend pod
    template: templates/frontend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].envFrom"
          content: {secretRef: {name: draftforge-backend-only}}
      - contains:
          path: "spec.template.spec.containers[0].envFrom"
          content: {secretRef: {name: draftforge-prod-env}}

  - it: keeps the backend-only Secret out of the Celery worker pod
    template: templates/celery-worker.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].envFrom"
          content: {secretRef: {name: draftforge-backend-only}}

  - it: keeps the backend-only Secret out of the Celery beat pod
    template: templates/celery-beat.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].envFrom"
          content: {secretRef: {name: draftforge-backend-only}}

  - it: keeps the backend-only Secret out of the Discord bot pod
    template: templates/discord-bot.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].envFrom"
          content: {secretRef: {name: draftforge-backend-only}}

  - it: rejects an empty Secret name
    template: templates/backend.yaml
    set:
      backend.extraEnvSecrets: [""]
    asserts:
      - failedTemplate: {}
