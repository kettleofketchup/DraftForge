suite: sync waves and annotations (spec 5.4 test 3)
# templates lists every template file; a new template must be added here.
# Wave -1: namespace controls. Wave 0: kinds healthy on apply. Wave 1 (last):
# every Deployment. No resource hooks and no sync-options annotation.
templates:
  - templates/namespace.yaml
  - templates/resourcequota.yaml
  - templates/limitrange.yaml
  - templates/networkpolicy.yaml
  - templates/serviceaccount.yaml
  - templates/secret.yaml
  - templates/configmap-env.yaml
  - templates/pvc.yaml
  - templates/redis.yaml
  - templates/backend.yaml
  - templates/celery-worker.yaml
  - templates/celery-beat.yaml
  - templates/discord-bot.yaml
  - templates/frontend.yaml
tests:
  # ---- preview ----
  - it: "preview: every document carries a sync-wave of -1, 0 or 1"
    release:
      name: draftforge-pr-1
      namespace: draftforge-pr-1
    values:
      - ../values-preview.yaml
      - fixtures/preview-appset-values.yaml
    asserts:
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/namespace.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/namespace.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/resourcequota.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/resourcequota.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/limitrange.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/limitrange.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/networkpolicy.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/networkpolicy.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/serviceaccount.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/serviceaccount.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/secret.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/secret.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/configmap-env.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/configmap-env.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/redis.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/redis.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/backend.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/backend.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/celery-worker.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/celery-worker.yaml
      - exists: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]"}
        template: templates/frontend.yaml
      - matchRegex: {path: "metadata.annotations[\"argocd.argoproj.io/sync-wave\"]", pattern: "^(-1|0|1)$"}
        template: templates/frontend.yaml
      - hasDocuments: {count: 0}
        template: templates/pvc.yaml
      - hasDocuments: {count: 0}
        template: templates/celery-beat.yaml
      - hasDocuments: {count: 0}
        template: templates/discord-bot.yaml

  - it: "preview: waves per kind"
