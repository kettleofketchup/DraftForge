suite: containers (command, resources, securityContext)
templates:
  - templates/backend.yaml
tests:
  - it: runs migrations as an explicit-argv init container with the cache disabled
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: "spec.template.spec.initContainers[0].name", value: migrate}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].command", value: [python, manage.py, migrate, --noinput]}
      - notExists: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].args"}
      - contains:
          path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].env"
          content: {name: DISABLE_CACHE, value: "true"}
      - lengthEqual: {path: spec.template.spec.initContainers, count: 1}

  - it: seeds through sh -ec when seed is enabled
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    set:
      seed.enabled: true
    asserts:
      - equal: {path: "spec.template.spec.initContainers[1].name", value: seed}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].command[0]", value: sh}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].command[1]", value: -ec}
      - matchRegex: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].command[2]", pattern: "python manage\\.py populate_all --force"}
      - contains:
          path: "spec.template.spec.initContainers[?(@.name == \"seed\")].env"
          content: {name: DISABLE_CACHE, value: "true"}

  - it: leaves the daphne entrypoint alone (no args on the backend container)
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: "spec.template.spec.containers[?(@.name == \"backend\")].args"}
      - notExists: {path: "spec.template.spec.containers[?(@.name == \"backend\")].command"}

  - it: gives every backend pod container resources and a restricted securityContext
    template: templates/backend.yaml
    documentSelector: {path: kind, value: Deployment}
    set:
      seed.enabled: true
    asserts:
      - equal: {path: spec.template.spec.securityContext.fsGroup, value: 1000}
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: false}
      - equal: {path: spec.template.spec.serviceAccountName, value: draftforge}
      - isNotNullOrEmpty: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].resources.requests.cpu"}
      - isNotNullOrEmpty: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].resources.requests.memory"}
      - isNotNullOrEmpty: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].resources.limits.memory"}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].securityContext.runAsNonRoot", value: true}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].securityContext.runAsUser", value: 1000}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].securityContext.runAsGroup", value: 1000}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].securityContext.allowPrivilegeEscalation", value: false}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].securityContext.capabilities.drop", value: [ALL]}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"migrate\")].securityContext.seccompProfile.type", value: RuntimeDefault}
      - isNotNullOrEmpty: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].resources.requests.cpu"}
      - isNotNullOrEmpty: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].resources.requests.memory"}
      - isNotNullOrEmpty: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].resources.limits.memory"}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].securityContext.runAsNonRoot", value: true}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].securityContext.runAsUser", value: 1000}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].securityContext.runAsGroup", value: 1000}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].securityContext.allowPrivilegeEscalation", value: false}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].securityContext.capabilities.drop", value: [ALL]}
      - equal: {path: "spec.template.spec.initContainers[?(@.name == \"seed\")].securityContext.seccompProfile.type", value: RuntimeDefault}
      - isNotNullOrEmpty: {path: "spec.template.spec.containers[?(@.name == \"backend\")].resources.requests.cpu"}
      - isNotNullOrEmpty: {path: "spec.template.spec.containers[?(@.name == \"backend\")].resources.requests.memory"}
      - isNotNullOrEmpty: {path: "spec.template.spec.containers[?(@.name == \"backend\")].resources.limits.memory"}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].securityContext.runAsNonRoot", value: true}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].securityContext.runAsUser", value: 1000}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].securityContext.runAsGroup", value: 1000}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].securityContext.allowPrivilegeEscalation", value: false}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].securityContext.capabilities.drop", value: [ALL]}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"backend\")].securityContext.seccompProfile.type", value: RuntimeDefault}
