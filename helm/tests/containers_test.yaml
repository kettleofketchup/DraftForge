      - equal: {path: "spec.template.spec.containers[?(@.name == \"frontend\")].securityContext.runAsGroup", value: 1000}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"frontend\")].securityContext.allowPrivilegeEscalation", value: false}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"frontend\")].securityContext.capabilities.drop", value: [ALL]}
