      - isNotNullOrEmpty: {path: "spec.template.spec.containers[?(@.name == \"redis\")].resources.limits.memory"}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].securityContext.runAsNonRoot", value: true}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].securityContext.runAsUser", value: 999}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].securityContext.runAsGroup", value: 1000}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].securityContext.allowPrivilegeEscalation", value: false}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].securityContext.capabilities.drop", value: [ALL]}
      - equal: {path: "spec.template.spec.containers[?(@.name == \"redis\")].securityContext.seccompProfile.type", value: RuntimeDefault}

