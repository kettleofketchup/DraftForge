# Prod-oriented defaults. Previews layer values-preview.yaml and the deploying
# ApplicationSet's valuesObject on top. The deploying cluster sets every preview
# limit (quota, LimitRange, rate limit); the chart only enforces that they are set.
fullnameOverride: ""      # resource name prefix; defaults to the constant "draftforge", never the release name
image:
  registry: ghcr.io/kettleofketchup/draftforge
  tag: ""                 # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []
priorityClassName: ""
previewCommit: ""         # set by the ApplicationSet; becomes pod annotation draftforge.kettle.sh/commit
# ephemeral-storage bounds the writable layer, logs and emptyDirs of each pod.
backend:   { replicas: 1, progressDeadlineSeconds: 900, resources: {requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}, limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}} }
frontend:  { replicas: 1, progressDeadlineSeconds: 300, resources: {requests: {cpu: 100m, memory: 192Mi, ephemeral-storage: 64Mi}, limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}} }
celeryWorker: { enabled: true, concurrency: 20, progressDeadlineSeconds: 300, resources: {requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}, limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}} }
celeryBeat:   { enabled: true, resources: {requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 64Mi}, limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}} }
discordBot:   { enabled: true, resources: {requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 64Mi}, limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}} }
redis:
  enabled: true
  image: redis:8.2.1-alpine
  progressDeadlineSeconds: 300
  dataSizeLimit: 256Mi    # emptyDir sizeLimit for /data
  resources: {requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi}, limits: {cpu: 200m, memory: 128Mi, ephemeral-storage: 512Mi}}
persistence: { enabled: true, size: 2Gi, storageClass: "", accessMode: ReadWriteOnce }
migrations: { enabled: true, resources: {requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi}, limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 2Gi}} }
seed: { enabled: false, commands: ["populate_all --force"], resources: {requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}, limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}} }
env:
  nodeEnv: production     # NODE_ENV, matches docker/.env.prod
  debug: false            # DEBUG
  test: false             # TEST
  release: false          # RELEASE, as docker/.env.prod
  ci: false               # CI
  siteUrl: ""             # SITE_URL (default https://<ingress.host>)
  otelEnabled: false      # differs from .env.prod (true): the chart ships no collector endpoint; a prod cutover sets both
  logFormat: json
  logLevel: INFO
  # Extra ConfigMap keys. They may only add keys: setting a key the chart
  # manages (TEST, DEBUG, CI, NODE_ENV, SITE_URL, REDIS_HOST, ...) fails the
  # render; use the env.* value instead.
  extra: {}
secrets:
  create: false
  djangoSecretKey: ""
  internalServiceToken: ""
# Secrets loaded with envFrom after the ConfigMap, so their keys win. Outside
# preview mode one of secrets.create or extraEnvSecrets is required, and the
# Secret must hold DJANGO_SECRET_KEY. The chart cannot see Secret contents: a
# key such as TEST in one of these Secrets reaches the pods unchecked.
extraEnvSecrets: []
ingress:
  enabled: true
  host: dota.kettle.sh
  # Traefik entry points the IngressRoute binds to. A non-empty entryPoints list
  # wins; otherwise the single entryPoint is used.
  entryPoint: websecure
  entryPoints: []
  tls: { secretName: "" }
  authentik: { enabled: false, middlewareName: "", middlewareNamespace: "" }
  blockInternalApi: true
  stripIdentityHeaders: false
  # Headers the strip-identity middleware removes. Set it to at least the
  # forward-auth middleware's authResponseHeaders.
  identityHeaders:
    - X-authentik-username
    - X-authentik-groups
    - X-authentik-entitlements
    - X-authentik-email
    - X-authentik-name
    - X-authentik-uid
    - X-authentik-jwt
    - X-authentik-meta-jwks
    - X-authentik-meta-outpost
    - X-authentik-meta-provider
    - X-authentik-meta-app
    - X-authentik-meta-version
  # Traefik RateLimit, first on every route. The aggregate limit (when
  # aggregate.average > 0) is keyed on the TCP peer and runs first; the
  # per-client limit after it is keyed on sourceHeader, or on the remote address
  # when sourceHeader is empty. Set sourceHeader only to a header the fronting
  # proxy always overwrites, and only if these hosts cannot reach Traefik
  # without that proxy: a client that sets the header itself gets a new bucket
  # per value. Preview mode requires both limits.
  rateLimit:
    enabled: false
    average: 0
    burst: 0
    period: 1s
    sourceHeader: ""
    aggregate: { average: 0, burst: 0 }
preview:
  enabled: false          # values-preview.yaml sets true; any draftforge-pr-* namespace requires it
  hostSuffix: ""          # e.g. preview.example.test; host must be <namespace>.<hostSuffix>
  # ResourceQuota spec.hard, set by the deploying cluster. The guard requires the
  # compute, ephemeral-storage and object-count keys it lists; the template pins
  # PVCs, storage, LoadBalancer/NodePort Services, Jobs and CronJobs to 0.
  resourceQuota: { hard: {} }
  # Container LimitRange, set by the deploying cluster. Each of default,
  # defaultRequest and max needs cpu, memory and ephemeral-storage.
  limitRange: { default: {}, defaultRequest: {}, max: {} }
  networkPolicy: { ingressNamespace: "" }   # namespace Traefik runs in
podSecurityContext: { fsGroup: 1000, runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault} }
