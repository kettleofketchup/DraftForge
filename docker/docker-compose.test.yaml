name: df
services:
  frontend:
    container_name: frontend
    image: ghcr.io/kettleofketchup/draftforge/frontend-dev:latest
    user: "1000:1000"
    env_file: "./docker/.env.test"
    volumes:
      - ./frontend:/app
    restart: always
    # Uses docker-entrypoint-frontend.sh which cleans cache and pre-optimizes on startup
    networks:
      - test-network

  redis:
    image: redis:8.2.1-alpine
    container_name: redis
    # Named volume, not a worktree-relative bind: the bind source changes the
    # config hash, so a run from another worktree recreated the shared redis.
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - test-network

  backend:
    container_name: backend
    env_file: "./docker/.env.test"
    image: ghcr.io/kettleofketchup/draftforge/backend-dev:latest
    restart: always
    environment:
      OTEL_SERVICE_NAME: backend
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
    networks:
      - test-network
    # Bump log retention so an 18+ minute Playwright run fits in the buffer
    # without rotating mid-run. Default Docker json-file rotation truncates
    # earlier logs; we need the full window when diagnosing transient
    # first-attempt timeouts.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
  nginx:
    image: ghcr.io/kettleofketchup/draftforge/nginx:latest
    container_name: nginx
    restart: always
    env_file: "./docker/.env.test"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.template.conf:/etc/nginx/templates/default.template.conf
      - ./nginx/data/ssl/cert.crt:/etc/letsencrypt/live/dota.kettle.sh/fullchain.pem
      - ./nginx/data/ssl/cert.key:/etc/letsencrypt/live/dota.kettle.sh/privkey.pem
      - ./nginx/data/user_conf.d:/etc/nginx/user_conf.d
    depends_on:
      - frontend
      - backend
    networks:
      test-network:
        aliases:
          - localhost

  celery-worker:
    image: ghcr.io/kettleofketchup/draftforge/backend-dev:latest
    user: "1000:1000"
    entrypoint: ["celery"]
    # Prod/release use --pool=gevent --concurrency=20 once the new image
    # (with gevent in pyproject) is built. Test+debug stay on prefork=4
    # until the dev image is rebuilt; both still verify the parallel-worker
    # scheduling behavior we care about.
    command: ["-A", "config.celery_light", "worker", "-l", "info", "--pool=prefork", "--concurrency=4", "--prefetch-multiplier=1"]
    volumes:
      - ./backend:/app/backend
    env_file: "./docker/.env.test"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_celery
      OTEL_SERVICE_NAME: celery-worker
    depends_on:
      - redis
      - backend
    restart: always
    networks:
      - test-network

  celery-beat:
    image: ghcr.io/kettleofketchup/draftforge/backend-dev:latest
    user: "1000:1000"
    entrypoint: ["celery"]
    command: ["-A", "config.celery_light", "beat", "-l", "info"]
    volumes:
      - ./backend:/app/backend
    env_file: "./docker/.env.test"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_celery
      OTEL_SERVICE_NAME: celery-beat
    depends_on:
      - redis
      - celery-worker
    restart: always
    networks:
      - test-network

  # dota_lobby in simulation mode: no Steam logon, simulated bots, players and
  # matches (docker/dota-lobby/simulator.yaml). Only for the 18-dota-lobby
  # Playwright specs, so it is behind a profile: start it with
  # `just test::dota-lobby up` or COMPOSE_PROFILES=dota-lobby. The image
  # defaults to the GHCR release pinned by DOTA_LOBBY_IMAGE_TAG, whose default
  # is a placeholder: set it to the first dota_lobby release with simulation
  # mode. Until then, point DOTA_LOBBY_IMAGE at a local build, for example
  # ghcr.io/kettleofketchup/dota_lobby:local (`just docker::build` in dota_lobby).
  dota-lobby:
    image: ${DOTA_LOBBY_IMAGE:-ghcr.io/kettleofketchup/dota_lobby:${DOTA_LOBBY_IMAGE_TAG:-simulation-release-placeholder}}
    profiles: ["dota-lobby"]
    command: ["serve", "--simulate"]
    environment:
      DOTA_LOBBY_SECRETS_FILE: /app/config/secrets.yaml
    volumes:
      - ./docker/dota-lobby/simulator.yaml:/app/config/config.yaml:ro
      - ./docker/dota-lobby/simulator-secrets.yaml:/app/config/secrets.yaml:ro
    # Lobbies live in memory; the state dir only holds the simulation database.
    tmpfs:
      - /app/state:mode=1777
    depends_on:
      - backend
    restart: always
    networks:
      - test-network

  discord-bot:
    image: ghcr.io/kettleofketchup/draftforge/backend-dev:latest
    user: "1000:1000"
    entrypoint: ["python", "manage.py", "run_discord_bot"]
    volumes:
      - ./backend:/app/backend
    env_file: "./docker/.env.test"
    environment:
      OTEL_SERVICE_NAME: discord
    depends_on:
      - redis
      - backend
    restart: always
    networks:
      - test-network

volumes:
  redis_data:

networks:
  test-network:
    driver: bridge
