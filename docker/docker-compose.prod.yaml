name: df
services:
  frontend:
    env_file: "./docker/.env.prod"
    image: ghcr.io/kettleofketchup/draftforge/frontend:latest
    user: "1000:1000"
    restart: always

  backend:
    env_file: "./docker/.env.prod"
    image: ghcr.io/kettleofketchup/draftforge/backend:latest
    restart: always
    environment:
      OTEL_SERVICE_NAME: backend
    volumes:
      - ./backend/db.sqlite3:/app/backend/prod.db.sqlite3
      - ./backend/.env:/app/backend/.env

    depends_on:
      - redis
  redis:
    image: redis:8.2.1-alpine
    container_name: redis
    volumes:
      - ./backend/.redis_data:/data
    restart: always
  nginx:
    image: ghcr.io/kettleofketchup/draftforge/nginx:latest
    container_name: nginx
    restart: always
    env_file: "./docker/.env.prod"
    ports:
      - "80:80"
      - "443:443"
    volumes:

      - ./nginx/default.template.conf:/etc/nginx/templates/default.template.conf
      - ./nginx/data/user_conf.d:/etc/nginx/user_conf.d
      - ./nginx/data/certbot/webroot/:/var/www/certbot/
      - ./nginx/data/certbot/work/:/lib/letsencrypt/
      - ./nginx/data/certbot/configs/:/etc/letsencrypt/
      - ./nginx/data/certbot/logs/:/var/log/letsencrypt/

      - ./nginx/data/ssl/cert.crt:/etc/letsencrypt/live/dota.kettle.sh/fullchain.pem
      - ./nginx/data/ssl/cert.key:/etc/letsencrypt/live/dota.kettle.sh/privkey.pem
    depends_on:
      - frontend
      - backend

  celery-worker:
    image: ghcr.io/kettleofketchup/draftforge/backend:latest
    user: "1000:1000"
    entrypoint: ["celery"]
    # gevent --concurrency=20 — every Celery task in this codebase is
    # I/O-bound (Discord API, Steam API, internal /api/internal/ HTTP).
    # gevent gives ~20 in-flight HTTP calls at a fraction of the memory of
    # prefork. prefetch=1 prevents a stuck task from hoarding the queue.
    # Safe because workers have no DB access (settings_celery.DATABASES = {});
    # all data work goes through /api/internal/.
    command: ["-A", "config.celery_light", "worker", "-l", "info", "--pool=gevent", "--concurrency=20", "--prefetch-multiplier=1"]
    env_file: "./docker/.env.prod"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_celery
      OTEL_SERVICE_NAME: celery-worker
    volumes:
      - ./backend/.env:/app/backend/.env
    depends_on:
      - redis
      - backend
    restart: always

  celery-beat:
    image: ghcr.io/kettleofketchup/draftforge/backend:latest
    user: "1000:1000"
    entrypoint: ["celery"]
    command: ["-A", "config.celery_light", "beat", "-l", "info"]
    env_file: "./docker/.env.prod"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_celery
      OTEL_SERVICE_NAME: celery-beat
    volumes:
      - ./backend/.env:/app/backend/.env
    depends_on:
      - redis
      - celery-worker
    restart: always

  discord-bot:
    image: ghcr.io/kettleofketchup/draftforge/backend:latest
    user: "1000:1000"
    entrypoint: ["python", "manage.py", "run_discord_bot"]
    env_file: "./docker/.env.prod"
    environment:
      OTEL_SERVICE_NAME: discord
    volumes:
      - ./backend/.env:/app/backend/.env
    depends_on:
      - redis
      - backend
    restart: always
