# Test-only secrets for the simulated dota_lobby (see simulator.yaml). They
# match docker/.env.test: DOTA_LOBBY_API_KEY, DOTA_LOBBY_WEBHOOK_SECRET and
# INTERNAL_SERVICE_TOKEN. No bot credentials: simulation mode refuses them.
secrets:
  api_key: "df-test-dota-lobby-api-key"
  webhook_secrets:
    "http://backend:8000/api/internal/lobbies/events/": "df-test-dota-lobby-webhook-secret"
  webhook_tokens:
    "http://backend:8000/api/internal/lobbies/events/": "df-test-internal-service-token"
