name: Release Docker Images

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  release-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate version tag
      if: github.event_name == 'push'
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        PYPROJECT_VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
          echo "::error::Tag ($TAG) does not match pyproject.toml version ($PYPROJECT_VERSION)"
          exit 1
        fi
        echo "VERSION=$TAG" >> "$GITHUB_ENV"
        echo "Building release images for version $TAG"

    - uses: ./.github/actions/setup-toolchain
      with:
        registry-token: ${{ secrets.GITHUB_TOKEN }}
        github-actor: ${{ github.actor }}

    - name: Build and push release images
      run: just docker::release::push
      env:
        DOCKER_BUILDKIT: 1

    - name: Output image info
      run: |
        echo "Release images pushed for version $VERSION:"
        just docker::hash
