name: Build Test Database Image

on:
  push:
    branches: [main]
    paths:
      - 'backend/tests/populate.py'
      - 'backend/tests/populate/*.py'
      - 'backend/tests/data/*.py'
      - 'backend/tests/helpers/tournament_config.py'
      - 'backend/app/management/commands/populate_*.py'
      - 'backend/**/migrations/*.py'
      - 'backend/**/models.py'
      - 'backend/**/models/*.py'
      - 'backend/**/models_*.py'
      # populate's direct imports; keep in step with scripts/hash-test-db-sources.sh
      - 'backend/common/game.py'
      - 'backend/config/promotion_sync.py'
      - 'backend/discordbot/services/users.py'
      - 'backend/events/constants.py'
      - 'backend/events/ledger.py'
      - 'backend/events/ready_check_constants.py'
      - 'backend/events/services.py'
      - 'backend/lobby/client.py'
      - 'backend/lobby/passwords.py'
      - 'backend/lobby/services.py'
      - 'backend/lobby/states.py'
      - 'backend/org/conduct/constants.py'
      - 'backend/org/contributions/kinds.py'
      - 'backend/org/contributions/services.py'
      - 'backend/org/features.py'
      - 'backend/org/integration/contacts.py'
      - 'backend/org/integration/receipts.py'
      - 'backend/org/leadership/lifecycle.py'
      - 'backend/org/leadership/reviews.py'
      - 'backend/org/leadership/traits.py'
      - 'backend/org/mmr.py'
      - 'backend/org/standing/api.py'
      - 'backend/steam/functions/stats_update.py'
      - 'backend/steam/mocks/mock_match_generator.py'
      - 'backend/tests/dota_lobby_sim.py'
      - 'backend/tests/helpers/steam_match.py'
      - 'backend/tests/test_auth.py'
      - 'backend/tournament/choices.py'
      - 'backend/tournament/services/bracket_placement.py'
      - 'backend/user/steam_accounts.py'
      - 'scripts/hash-test-db-sources.sh'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kettleofketchup/draftforge/test-db

jobs:
  build-test-db:
    # Trusted builds only: a push to main or a dispatch from main. This job writes
    # draftforge/* and GHCR :buildcache, which main and releases read.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: ./.github/actions/setup-toolchain
      with:
        registry-token: ${{ secrets.GITHUB_TOKEN }}
        github-actor: ${{ github.actor }}

    - name: Build test-db image
      run: just docker::db::build
      env:
        DOCKER_BUILDKIT: 1

    - name: Push to GHCR
      run: just docker::db::push

    - name: Output image info
      run: |
        echo "Test DB image pushed with hash: $(just docker::db::hash)"
        ls -lh backend/test.db.sqlite3
