name: Build Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'frontend/Dockerfile'
      - 'frontend/package-lock.json'
      - 'backend/Dockerfile'
      - 'poetry.lock'
      - 'nginx/Dockerfile'
      - 'nginx/entrypoint.sh'
      - 'nginx/default.template.conf'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: ./.github/actions/setup-toolchain
      with:
        registry-token: ${{ secrets.GITHUB_TOKEN }}
        github-actor: ${{ github.actor }}

    - name: Build and push all images
      run: just docker::all-push
      env:
        DOCKER_BUILDKIT: 1

    - name: Output image info
      run: |
        echo "Images pushed with hashes:"
        just docker::hash
