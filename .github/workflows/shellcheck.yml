name: Shellcheck

# Runs only when something its two jobs read changes: `just ci::shellcheck` lints the
# justfile, its modules under just/ and its own checker scripts; the runs-on guard reads
# every workflow plus its own scripts.
on:
  push:
    branches: [main]
    paths: &checked
      - 'justfile'
      - 'just/**'
      - 'scripts/shellcheck_just.py'
      - 'scripts/test_shellcheck_just.py'
      # The runs-on guard below must see every workflow change, or a self-hosted
      # runs-on could land without it running.
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'scripts/check-runs-on.sh'
      - 'scripts/test_check_runs_on.py'
  # fix/** matches playwright.yml, so the runs-on guard sees every PR that can run prepare.
  pull_request:
    branches: [main, 'fix/**']
    paths: *checked

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: shellcheck (just recipes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned like the changelog gate so a new release cannot change what passes.
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: '1.59.0'

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Shellcheck just recipes
        run: just ci::shellcheck

  # Only playwright.yml `prepare` may use the draftforge-home runner (scripts/check-runs-on.sh).
  runs-on-guard:
    name: runs-on guard (home runner label)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the guard
        run: python3 -I scripts/test_check_runs_on.py

      - name: Check which jobs use the home runner label
        run: bash scripts/check-runs-on.sh
