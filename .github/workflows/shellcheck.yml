name: Shellcheck

# Runs only when something its two jobs read changes: `just ci::shellcheck` lints the
# justfile, its modules under just/ and its own checker scripts; the runs-on guard reads
# every workflow plus its own scripts.
on:
  push:
    branches: [main]
    paths: &checked
      - 'justfile'
      - 'just/**'
      - 'scripts/shellcheck_just.py'
      - 'scripts/test_shellcheck_just.py'
      # The runs-on guard below must see every workflow change, or a self-hosted
      # runs-on could land without it running.
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'scripts/check-runs-on.sh'
      - 'scripts/test_check_runs_on.py'
  # fix/** matches playwright.yml, so the runs-on guard sees every PR that can run prepare.
  pull_request:
    branches: [main, 'fix/**']
    paths: *checked

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: shellcheck (just recipes)
    # Small job: the home runner for allowlisted same-repo PRs when SELF_HOSTED_RUNNERS
    # is 'true', to free hosted slots (docs/development/ci-runners.md). Same guard as
    # playwright.yml `prepare`; scripts/check-runs-on.sh holds the allowlist.
    runs-on: >-
      ${{ (vars.SELF_HOSTED_RUNNERS == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.event.pull_request.user.login))
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.triggering_actor)))
      && 'draftforge-home' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned like the changelog gate so a new release cannot change what passes.
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: '1.59.0'

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          # Python's tarfile, not `tar -xJ`: the home runner image has no xz.
          python3 -I -m tarfile --filter data -e "$RUNNER_TEMP/$archive" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Shellcheck just recipes
        run: just ci::shellcheck

  # Only the jobs allowlisted in scripts/check-runs-on.sh may use the draftforge-home runner.
  runs-on-guard:
    name: runs-on guard (home runner label)
    # Small job: the home runner for allowlisted same-repo PRs when SELF_HOSTED_RUNNERS
    # is 'true', to free hosted slots (docs/development/ci-runners.md). Same guard as
    # playwright.yml `prepare`; scripts/check-runs-on.sh holds the allowlist.
    runs-on: >-
      ${{ (vars.SELF_HOSTED_RUNNERS == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.event.pull_request.user.login))
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.triggering_actor)))
      && 'draftforge-home' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      YQ_VERSION: v4.54.3
      YQ_SHA256: 129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned, and installed on hosted runners too (they ship a yq that moves): the
      # home runner image has none.
      - name: Install yq ${{ env.YQ_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/yq"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yq/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq/yq"
          echo "$RUNNER_TEMP/yq" >> "$GITHUB_PATH"

      - name: Test the guard
        run: python3 -I scripts/test_check_runs_on.py

      - name: Check which jobs use the home runner label
        run: bash scripts/check-runs-on.sh
