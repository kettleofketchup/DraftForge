name: Frontend shadcn lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-shadcn-lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadcn-lint:
    name: shadcn-lint (design system)
    # Small job, on the home runner to free hosted slots: same-repo PRs from
    # HOME_RUNNER_AUTHORS when SELF_HOSTED_RUNNERS is 'true' (docs/development/ci-runners.md).
    # Same guard as playwright.yml `prepare`; scripts/check-runs-on.sh allowlists this job.
    runs-on: >-
      ${{ (vars.SELF_HOSTED_RUNNERS == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.event.pull_request.user.login))
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.triggering_actor)))
      && 'draftforge-home' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund

      # All of app/ against the baseline: new violations fail, and so do baseline
      # entries that no longer occur (run `just frontend::lint-shadcn-prune`).
      - name: shadcn-lint
        run: npm --prefix frontend run lint:shadcn
