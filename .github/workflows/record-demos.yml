name: Record Demo Videos

on:
  workflow_dispatch:
    inputs:
      demo:
        description: 'Which demo to record'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - herodraft
          - shuffle
          - snake
      create_pr:
        description: 'Create PR instead of committing directly'
        type: boolean
        default: true

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: ./.github/actions/setup-playwright-stack
      with:
        registry-token: ${{ secrets.GITHUB_TOKEN }}
        github-actor: ${{ github.actor }}

    # demo::gifs needs ffmpeg on PATH; the runner image has none.
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Record demo videos
      run: just demo::${{ inputs.demo }}
      env:
        CI: true

    - name: Convert videos to GIFs
      run: just demo::gifs

    # Keep the recorded videos even if GIF conversion failed.
    - name: Upload demo artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: demo-videos
        path: |
          docs/assets/videos/
          docs/assets/gifs/
        retention-days: 30

    - name: Create PR with videos
      if: inputs.create_pr
      uses: peter-evans/create-pull-request@v5
      with:
        title: 'docs: update ${{ inputs.demo }} demo videos'
        body: |
          Updated demo videos via manual workflow.

          **Demo recorded:** `${{ inputs.demo }}`

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        branch: docs/demo-videos-${{ github.run_id }}
        commit-message: 'docs: update ${{ inputs.demo }} demo videos'
        add-paths: |
          docs/assets/videos/
          docs/assets/gifs/

    - name: Commit directly
      if: ${{ !inputs.create_pr }}
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add docs/assets/videos/ docs/assets/gifs/
        git commit -m "docs: update ${{ inputs.demo }} demo videos" || echo "No changes to commit"
        git push

    - name: Clean up
      if: always()
      run: |
        docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true
        docker container prune -f || true
        docker volume prune -f || true
