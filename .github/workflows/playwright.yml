name: Playwright Tests

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'fix/**'

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kettleofketchup/draftforge

jobs:
  chromium:
    name: Playwright chromium (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (chromium shard ${{ matrix.shard }}/4)
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '2'
        run: just test::pw::cicd-chromium --shard=${{ matrix.shard }}/4

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  mobile:
    name: Playwright mobile (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (mobile shard ${{ matrix.shard }}/2)
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '2'
        run: just test::pw::cicd-mobile --shard=${{ matrix.shard }}/2

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  herodraft:
    name: Playwright herodraft (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (herodraft, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-herodraft --workers=1

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-herodraft
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  events:
    name: Playwright events (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (events-sequential, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-events --workers=1

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-events
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  backend:
    name: Backend tests (test_bracket)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run backend tests
        env:
          CI: 'true'
        run: |
          docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml exec -T backend \
            python manage.py test \
              app.tests.test_bracket \
              app.tests.test_discord_reclaim \
              events.discord.tests \
              events.tests.test_signup_interactions \
              events.tests.test_series_oneoff \
              user.tests \
              steam.tests \
              org.tests \
              tests.test_populate_utils \
              discordbot.tests.test_components \
              discordbot.tests.test_custom_ids \
              discordbot.tests.test_interaction_router \
              discordbot.tests.test_log_context \
              events.tests.test_discord_decline_button \
              events.tests.test_provider_registry \
              events.tests.test_create_discord_scheduled_event \
              events.tests.test_sync_discord_scheduled_event_window \
              app.tests.test_task_schedule \
              app.tests.test_build_users_dict \
              app.tests.test_herodraft_tick \
              app.tests.test_herodraft_consumers \
              app.tests.test_consumers_base \
              app.tests.test_stale_connection \
              app.tests.test_draft_consumers \
              app.tests.test_shuffle_draft \
              app.tests.test_draft_tick \
              app.tests.test_draft_consumers_base \
              tests.test_populate \
              discordbot.tests.test_signup_logging \
              events.tests.test_modal_config_contract \
              events.tests.test_discord \
              events.tests.test_reaction_signup \
              app.tests.test_env_utils \
              app.tests.test_settings_env_overrides \
              app.tests.test_redis_namespace \
              app.tests.test_test_runner \
              -v 2

      - name: Run frontend Vitest
        env:
          CI: 'true'
        run: |
          docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml exec -T frontend \
            npm test -- --run

      - name: Run slot guards on the runner
        run: |
          npm --prefix frontend exec -- vitest run --root frontend tests/unit/playwright-literal-guard.test.ts
          just test::slots-unit

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs backend 2>&1 | tail -200 || true

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true
