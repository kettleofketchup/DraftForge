name: Playwright Tests

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'fix/**'

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kettleofketchup/draftforge

jobs:
  chromium:
    name: Playwright chromium (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (chromium shard ${{ matrix.shard }}/4)
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '2'
        run: just test::pw::cicd-chromium --shard=${{ matrix.shard }}/4

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      # Tests that fail and pass on retry still leave traces (retain-on-failure); keep them
      # and the server logs so a green run does not discard the evidence.
      - name: Save container logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p frontend/test-results
          for c in frontend backend nginx; do docker logs "$c" > "frontend/test-results/$c.log" 2>&1 || true; done

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  mobile:
    name: Playwright mobile (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (mobile shard ${{ matrix.shard }}/2)
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '2'
        run: just test::pw::cicd-mobile --shard=${{ matrix.shard }}/2

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  herodraft:
    name: Playwright herodraft (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (herodraft, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-herodraft --workers=1

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-herodraft
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  layout:
    name: Playwright layout (overlap and clip-escape sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (layout)
        env:
          CI: 'true'
        run: just test::pw::cicd-layout

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-layout
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  events:
    name: Playwright events (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (events-sequential, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-events --workers=1

      # The 18-dota-lobby specs run against the simulated dota_lobby (profile
      # dota-lobby, image pinned by DOTA_LOBBY_IMAGE_TAG). With it running,
      # cicd-dota-lobby sets DOTA_LOBBY_SIMULATOR_REQUIRED=1, so a spec that
      # would skip for lack of the simulator fails instead.
      - name: Start the simulated dota_lobby
        run: just test::dota-lobby up

      - name: Run Playwright (dota-lobby-sequential)
        env:
          CI: 'true'
        run: just test::pw::cicd-dota-lobby

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true
          just test::compose logs --tail=200 dota-lobby || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-events
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  org-features:
    name: Playwright org features (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (org-features-sequential, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-org-features --workers=1

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-org-features
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      # No labels: BackendDiscoverRunner discovers every test*.py module under backend/.
      - name: Run backend tests
        env:
          CI: 'true'
        run: |
          docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml exec -T backend \
            python manage.py test -v 2

      - name: Run frontend Vitest
        env:
          CI: 'true'
        run: |
          docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml exec -T frontend \
            npm test -- --run

      - name: Check the promotion render fixture copies match
        run: cmp backend/org/tests/render_fixture.json frontend/app/features/promotion/__tests__/render_fixture.json

      - name: Run slot guards on the runner
        run: |
          npm --prefix frontend exec -- vitest run --root frontend tests/unit/playwright-literal-guard.test.ts
          just test::slots-unit

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs backend 2>&1 | tail -200 || true

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true
