name: Playwright Tests

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'fix/**'

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kettleofketchup/draftforge

jobs:
  events:
    name: Playwright events (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    # Each shard gets its own stack and test DB, so specs that share seeded
    # state (one worker per stack) can still split across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (events-sequential shard ${{ matrix.shard }}/2, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-events --workers=1 --shard=${{ matrix.shard }}/2

      - name: Diag probe warm-up before simulator
        if: matrix.shard == 1
        env:
          CI: 'true'
        run: just test::pw::spec 00-hydration-handling --project=chromium || true

      - name: Diag container logs before simulator
        if: always()
        run: |
          docker logs frontend > /tmp/diag-frontend-1.log 2>&1 || true
          docker logs backend > /tmp/diag-backend-1.log 2>&1 || true
          docker logs nginx > /tmp/diag-nginx-1.log 2>&1 || true

      # The 18-dota-lobby specs run against the simulated dota_lobby (profile
      # dota-lobby, image pinned by DOTA_LOBBY_IMAGE_TAG). With it running,
      # cicd-dota-lobby sets DOTA_LOBBY_SIMULATOR_REQUIRED=1, so a spec that
      # would skip for lack of the simulator fails instead.
      - name: Start the simulated dota_lobby
        if: matrix.shard == 2
        run: just test::dota-lobby up

      - name: Run Playwright (dota-lobby-sequential)
        if: matrix.shard == 2
        env:
          CI: 'true'
        run: just test::pw::cicd-dota-lobby

      - name: Dump container logs on failure
        if: always()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true
          just test::compose logs --tail=200 dota-lobby || true

      - name: Diag save all logs
        if: always()
        run: |
          mkdir -p frontend/test-results/diag-logs
          cp /tmp/diag-*.log frontend/test-results/diag-logs/ || true
          docker logs frontend > frontend/test-results/diag-logs/frontend-2.log 2>&1 || true
          docker logs backend > frontend/test-results/diag-logs/backend-2.log 2>&1 || true
          docker logs nginx > frontend/test-results/diag-logs/nginx-2.log 2>&1 || true
          just test::compose logs celery-beat celery-worker dota-lobby > frontend/test-results/diag-logs/bg.log 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-events-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

