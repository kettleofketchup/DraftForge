name: Playwright Tests

# paths-ignore skips a run only when EVERY changed file matches. GitHub does not evaluate
# path filters for tag pushes, so v* tags always run. '*.md' matches only at the repo root,
# so frontend/app/data/CHANGELOG.md, which ships in the app, stays covered.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore: &docs-only
      - 'docs/**'
      - 'changelog.d/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'LICENSE'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'helm/**'
      - 'scripts/helm_*'
      - 'scripts/preview_tests/**'
      - '.github/workflows/changelog.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/frontend-format.yml'
      - '.github/workflows/frontend-shadcn-lint.yml'
      - '.github/workflows/helm-chart.yml'
      - '.github/workflows/issue-labeler.yml'
      - '.github/workflows/pr-labeler.yml'
      - '.github/workflows/preview-queue.yml'
      - '.github/workflows/record-demos.yml'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches:
      - main
      - 'fix/**'
    paths-ignore: *docs-only

# Cancel superseded PR runs; let main runs finish so main always gets a result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kettleofketchup/draftforge
  # 'true' when `prepare` runs on the home runner (the same guard as its runs-on, which
  # cannot read `env`); test jobs then also look for this PR's draftforge-ci images.
  # scripts/check-runs-on.sh keeps the two identical. HOME_RUNNER_AUTHORS unset means false.
  HOME_PREPARE: >-
    ${{ vars.SELF_HOSTED_RUNNERS == 'true'
    && github.event_name == 'pull_request'
    && github.event.pull_request.head.repo.full_name == github.repository
    && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.event.pull_request.user.login))
    && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.triggering_actor)) }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  # Builds and pushes (content-hash tag only) any stack image or test DB the registry
  # lacks, once, so the test jobs below only pull. Runs on ubuntu-latest, or on the home
  # runner (draftforge-home) for an allowlisted same-repo PR when SELF_HOSTED_RUNNERS is
  # 'true'. There it builds through the home BuildKit and pushes only
  # draftforge-ci/<img>:pr-<n>-<hash> (PR mode), never a draftforge/ tag or :buildcache.
  # The runs-on guard is convenience; the runner's job-started hook (home repo) is the
  # boundary. scripts/check-runs-on.sh rejects any other runs-on that is not a hosted label.
  prepare:
    name: Prepare images and test DB
    runs-on: >-
      ${{ (vars.SELF_HOSTED_RUNNERS == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.event.pull_request.user.login))
      && contains(format(',{0},', vars.HOME_RUNNER_AUTHORS), format(',{0},', github.triggering_actor)))
      && 'draftforge-home' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Record start time
        run: echo "PREPARE_START=$(date +%s)" >> "$GITHUB_ENV"

      # Pinned by SHA and no persisted token: this job may run on the home runner.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          buildx: 'false'
          python: 'false'

      # Home runner only: Zot cache auth for the remote BuildKit; ci::prepare-images
      # connects the builder itself, and only when something needs building.
      - name: Set up registry auth for the home builder
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-builder
        with:
          ghcr-user: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          zot-password: ${{ secrets.ZOT_CI_PASSWORD }}
          bootstrap: 'false'

      # Home runner only: the test DB populates on the host, and the runner image has no
      # pipx for `just ci::venv`, so set up Python and Poetry only when the test DB is missing.
      - name: Check whether the test DB needs building
        id: home-probe
        if: runner.environment == 'self-hosted'
        env:
          DF_PREPARE_PR: ${{ github.event.pull_request.number }}
        run: just ci::prepare-images --probe | tee -a "$GITHUB_OUTPUT"

      - name: Set up Python for the test DB
        if: runner.environment == 'self-hosted' && contains(steps.home-probe.outputs.missing, 'test-db')
        uses: ./.github/actions/setup-toolchain
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          buildx: 'false'
          python: 'true'

      - name: Build and push missing images and test DB
        env:
          DF_PREPARE_READONLY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '1' || '' }}
          # Set only on the home runner: PR mode, pushes draftforge-ci/ tags only.
          DF_PREPARE_PR: ${{ runner.environment == 'self-hosted' && github.event.pull_request.number || '' }}
        run: just ci::prepare-images

      - name: Report elapsed time
        if: always()
        run: echo "prepare job took $(( $(date +%s) - PREPARE_START ))s"

  chromium:
    needs: prepare
    if: ${{ !cancelled() }}
    name: Playwright chromium (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (chromium shard ${{ matrix.shard }}/4)
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '2'
        run: just test::pw::cicd-chromium --shard=${{ matrix.shard }}/4

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      # Tests that fail and pass on retry still leave traces (retain-on-failure); keep them
      # and the server logs so a green run does not discard the evidence.
      - name: Save container logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p frontend/test-results
          for c in frontend backend nginx; do docker logs "$c" > "frontend/test-results/$c.log" 2>&1 || true; done

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  mobile:
    needs: prepare
    if: ${{ !cancelled() }}
    name: Playwright mobile (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (mobile shard ${{ matrix.shard }}/2)
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '2'
        run: just test::pw::cicd-mobile --shard=${{ matrix.shard }}/2

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  herodraft:
    needs: prepare
    if: ${{ !cancelled() }}
    name: Playwright herodraft (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    # Each shard gets its own stack and test DB, so specs that share seeded
    # state (one worker per stack) can still split across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (herodraft shard ${{ matrix.shard }}/2, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-herodraft --workers=1 --shard=${{ matrix.shard }}/2

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-herodraft-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  layout:
    needs: prepare
    if: ${{ !cancelled() }}
    name: Playwright layout (overlap and clip-escape sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (layout)
        env:
          CI: 'true'
        run: just test::pw::cicd-layout

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-layout
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  events:
    needs: prepare
    if: ${{ !cancelled() }}
    name: Playwright events (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    # Each shard gets its own stack and test DB, so specs that share seeded
    # state (one worker per stack) can still split across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (events-sequential shard ${{ matrix.shard }}/2, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-events --workers=1 --shard=${{ matrix.shard }}/2

      # The 18-dota-lobby specs run against the simulated dota_lobby (profile
      # dota-lobby, image pinned by DOTA_LOBBY_IMAGE_TAG). With it running,
      # cicd-dota-lobby sets DOTA_LOBBY_SIMULATOR_REQUIRED=1, so a spec that
      # would skip for lack of the simulator fails instead.
      - name: Start the simulated dota_lobby
        if: matrix.shard == 2
        run: just test::dota-lobby up

      - name: Run Playwright (dota-lobby-sequential)
        if: matrix.shard == 2
        env:
          CI: 'true'
        run: just test::pw::cicd-dota-lobby

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true
          just test::compose logs --tail=200 dota-lobby || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-events-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  org-features:
    needs: prepare
    if: ${{ !cancelled() }}
    name: Playwright org features (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

      - name: Run Playwright (org-features-sequential, workers=1)
        env:
          CI: 'true'
        run: just test::pw::cicd-org-features --workers=1

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs frontend 2>&1 | tail -200 || true
          docker logs backend 2>&1 | tail -200 || true
          docker logs nginx 2>&1 | tail -100 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-org-features
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  backend:
    needs: prepare
    if: ${{ !cancelled() }}
    name: Backend tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        group: [app, migrations, rest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright-stack
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          image-prefix: ${{ env.IMAGE_PREFIX }}
          playwright: 'false'

      - name: Run backend tests (${{ matrix.group }})
        env:
          CI: 'true'
        run: |
          labels="$(just ci::backend-test-labels ${{ matrix.group }})"
          echo "Labels: $labels"
          # Dump every test process's stacks well before the 25-minute job timeout.
          # shellcheck disable=SC2086 # one label per word
          docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml exec -T \
            -e DF_TEST_HANG_DUMP_SECONDS=1140 backend \
            python manage.py test -v 2 --parallel auto $labels

      - name: Check migrations are committed
        if: matrix.group == 'app'
        run: |
          docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml exec -T backend \
            python manage.py makemigrations --check --dry-run

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs backend 2>&1 | tail -200 || true

      - name: Clean up
        if: always()
        run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml down -v || true

  unit:
    name: Unit tests (Vitest, slot guards)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          buildx: 'false'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend Vitest
        env:
          CI: 'true'
        run: npm --prefix frontend test -- --run

      - name: Check the generated message types are current
        run: just py::gen-message-types --check

      - name: Check the generated Discord connect API is current
        run: just py::gen-discord-connect-api --check

      - name: Check the promotion render fixture copies match
        run: cmp backend/org/tests/render_fixture.json frontend/app/features/promotion/__tests__/render_fixture.json

      - name: Check the generated notice types are current
        run: just py::notice-types-check

      - name: Run slot guards
        run: just test::slots-unit
