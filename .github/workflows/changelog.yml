name: Changelog

on:
  push:
    branches: [main]
  pull_request:
    # No `labeled`: after adding changelog:edit, re-run the failed job instead.
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read # reads the PR's labels live

# Only PR runs are superseded: the push check reads HEAD~1..HEAD, so a cancelled
# push run would never report that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    # Headroom for setup-just retrying GitHub 5xx; the check itself takes seconds.
    timeout-minutes: 15
    steps:
      # fetch-depth: 0: the recipe diffs against the merge base and reads release history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned so the gate cannot change behaviour without a commit.
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: '1.59.0'

      - name: Changelog fragments gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: just ci::changelog-check
