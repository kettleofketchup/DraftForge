name: Setup Toolchain
description: >
  GHCR login + Python 3.12 + Poetry 2.2 (with .venv cache) + Just + Docker
  Buildx. Shared base layer for every workflow that builds/pushes images or
  drives docker compose. Composed by setup-playwright-stack/action.yml on top
  of this for E2E jobs.

inputs:
  registry-token:
    description: GHCR token (pass secrets.GITHUB_TOKEN)
    required: true
  github-actor:
    description: GitHub actor for GHCR login
    required: true

runs:
  using: composite
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.github-actor }}
        password: ${{ inputs.registry-token }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: '2.2.0'
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

    - name: Install Python dependencies
      shell: bash
      run: poetry install --no-interaction --no-ansi

    - name: Set up Just
      uses: extractions/setup-just@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
