name: Setup Toolchain
description: >
  GHCR login + Just + Python 3.12 + Poetry 2.2 (with .venv cache, unless
  python is 'false') + Docker Buildx. Shared base layer for every workflow that builds/pushes images or
  drives docker compose. Composed by setup-playwright-stack/action.yml on top
  of this for E2E jobs.

inputs:
  registry-token:
    description: GHCR token (pass secrets.GITHUB_TOKEN)
    required: true
  github-actor:
    description: GitHub actor for GHCR login
    required: true
  buildx:
    description: >
      'false' skips booting a docker-container builder (~10s), for jobs that only
      pull images; `just ci::buildx-builder` boots one if a fallback build needs it
    required: false
    default: 'true'
  prefetch:
    description: >
      'true' starts pulling the images and test DB in the background
      (`just ci::prefetch-start`) before Python and Poetry are set up
    required: false
    default: 'false'
  python:
    description: >
      'false' skips Python, Poetry and the .venv, for jobs whose host-side helpers
      are stdlib-only (run them with DF_JUST_PYTHON=python3)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.github-actor }}
        password: ${{ inputs.registry-token }}

    # Keep in step with changelog.yml and shellcheck.yml.
    - name: Set up Just
      id: setup-just
      continue-on-error: true
      uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      with:
        just-version: '1.59.0'

    # setup-just still lists releases through the GitHub API; a bad response there
    # falls back to the pinned release asset.
    - name: Set up Just (direct download)
      if: steps.setup-just.outcome == 'failure'
      shell: bash
      env:
        JUST_VERSION: '1.59.0'
      run: |
        case "$RUNNER_ARCH" in
          X64) target=x86_64 sha=409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e ;;
          ARM64) target=aarch64 sha=23871b1702bfd550fb5f901778fd4290ecf2ee034a45a889fbe96d89b188086d ;;
          *) echo "::error::no pinned just asset for $RUNNER_ARCH"; exit 1 ;;
        esac
        asset="just-${JUST_VERSION}-${target}-unknown-linux-musl.tar.gz"
        dir="$RUNNER_TEMP/just-${JUST_VERSION}"
        mkdir -p "$dir"
        curl -fsSL --retry 5 --retry-all-errors -o "$dir/$asset" \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/${asset}"
        echo "${sha}  $dir/$asset" | sha256sum -c -
        tar -xzf "$dir/$asset" -C "$dir" just
        echo "$dir" >> "$GITHUB_PATH"

    - name: Start image and test-DB prefetch
      if: inputs.prefetch == 'true'
      shell: bash
      run: just ci::prefetch-start

    - name: Set up Python
      if: inputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      if: inputs.python == 'true'
      uses: snok/install-poetry@v1
      with:
        version: '2.2.0'
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      if: inputs.python == 'true'
      uses: actions/cache@v4
      with:
        path: .venv
        # Interpreter paths differ between hosted and self-hosted runners, so venvs must not cross.
        key: poetry-${{ runner.os }}-${{ runner.environment }}-${{ hashFiles('poetry.lock') }}

    - name: Install Python dependencies
      if: inputs.python == 'true'
      shell: bash
      run: poetry install --no-interaction --no-ansi

    # The self-hosted runner has no daemon; setup-builder creates the remote builder there.
    - name: Set up Docker Buildx
      if: inputs.buildx == 'true' && runner.environment != 'self-hosted'
      uses: docker/setup-buildx-action@v3
