name: Setup Playwright Stack
description: >
  Pull cached Docker images, populate or restore the test database, start the
  test compose stack (docker-compose.test.yaml + docker-compose.ci.override.yaml),
  and wait for services to respond. Used by every Playwright job so the setup
  is defined once and the per-shard runs only diff in the project + --shard
  flag they pass to Playwright. The override file disables discord-bot and
  swaps frontend mounts so the image's node_modules survive.

inputs:
  registry-token:
    description: GHCR token (pass secrets.GITHUB_TOKEN)
    required: true
  github-actor:
    description: GitHub actor for GHCR login
    required: true
  image-prefix:
    description: GHCR image prefix
    required: false
    default: ghcr.io/kettleofketchup/draftforge
  playwright:
    description: >
      'true' runs `just test::pw::*` inside the frontend-dev image
      (DF_PW_CONTAINER=1), so the runner needs no Node or browsers; 'false' for
      jobs that only exec into the stack (backend tests)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-toolchain
      with:
        registry-token: ${{ inputs.registry-token }}
        github-actor: ${{ inputs.github-actor }}
        buildx: 'false'
        prefetch: 'true'
        python: 'false'

    - name: Run host helpers on the runner's python3, Playwright in frontend-dev
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.playwright }}
      run: |
        echo "DF_JUST_PYTHON=python3" >> "$GITHUB_ENV"
        if [[ "$PLAYWRIGHT" == true ]]; then
          echo "DF_PW_CONTAINER=1" >> "$GITHUB_ENV"
          ln -sfn /app/node_modules frontend/node_modules
        fi

    - name: Pull or Build Docker images
      shell: bash
      run: |
        if just ci::prefetch-wait images; then
          echo "Images pulled successfully"
        else
          echo "Pull failed, building with buildx + registry cache..."
          just ci::buildx-builder
          just docker::frontend::build-dev
        fi

    - name: Rebuild frontend-dev image if pulled :latest is stale
      shell: bash
      env:
        IMAGE_PREFIX: ${{ inputs.image-prefix }}
      run: |
        FRONTEND_HASH=$(just docker::hash frontend)
        FRONTEND_IMAGE="${IMAGE_PREFIX}/frontend-dev:${FRONTEND_HASH}"
        if docker image inspect "$FRONTEND_IMAGE" >/dev/null 2>&1; then
          echo "frontend-dev:${FRONTEND_HASH:0:12} present (deps in sync)"
        else
          echo "frontend-dev image lacks current package-lock hash; rebuilding"
          just ci::buildx-builder
          just docker::frontend::build-dev
        fi

    - name: Rebuild backend-dev image if pulled :latest is stale
      shell: bash
      env:
        IMAGE_PREFIX: ${{ inputs.image-prefix }}
      run: |
        BACKEND_HASH=$(just docker::hash backend)
        BACKEND_IMAGE="${IMAGE_PREFIX}/backend-dev:${BACKEND_HASH}"
        if docker image inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
          echo "backend-dev:${BACKEND_HASH:0:12} present (deps in sync)"
        else
          echo "backend-dev image lacks current poetry.lock hash; rebuilding"
          just ci::buildx-builder
          just docker::backend::build-dev
        fi

    - name: Get test database
      shell: bash
      run: |
        if just ci::prefetch-wait db; then
          HASH=$(just docker::db::hash)
          EXISTING=$(docker inspect --format='{{index .Config.Labels "org.draftforge.test-db.content-hash"}}' draftforge/test-db:latest 2>/dev/null || echo "")
          if [[ "$HASH" == "$EXISTING" ]]; then
            just db::reset-test
            echo "Exact hash match - using cached database"
            exit 0
          fi
          echo "Hash mismatch (expected ${HASH:0:12}, got ${EXISTING:0:12}); falling back to populate"
        fi
        echo "Populating test database from scratch..."
        DF_JUST_PYTHON="$(just ci::venv)" just db::populate::fresh

    - name: Fix database permissions
      shell: bash
      run: |
        chmod 777 backend
        chmod 666 backend/test.db.sqlite3

    - name: Start test services
      shell: bash
      env:
        COMPOSE_IGNORE_ORPHANS: 'true'
      run: docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml up -d --no-build

    - name: Wait for services to be ready
      shell: bash
      run: |
        for i in $(seq 1 60); do
          if curl -ks https://localhost/api/ -o /dev/null 2>&1; then
            echo "Services ready"
            exit 0
          fi
          sleep 2
        done
        echo "WARNING: services not ready after 120s"
        docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml ps
        docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml logs --tail=40
        exit 1

    # Celery tasks reach the database only through the internal API. If the worker's
    # token is not accepted, every task fails with 403 while the specs still pass.
    - name: Check celery worker can authenticate to the internal API
      shell: bash
      run: |
        docker compose --project-directory . -f docker/docker-compose.test.yaml -f docker/docker-compose.ci.override.yaml \
          exec -T celery-worker python - <<'EOF'
        import sys
        import time
        from app.internal_client.transport import get
        # The readiness probe above goes through nginx, so daphne may still be starting.
        for _ in range(30):
            resp = get("/steam/tracked-leagues/")
            if resp is not None:
                break
            time.sleep(2)
        status = "unreachable" if resp is None else resp.status_code
        print(f"celery-worker GET /api/internal/steam/tracked-leagues/ -> {status}")
        sys.exit(0 if resp is not None and resp.ok else 1)
        EOF
