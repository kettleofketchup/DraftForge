proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m max_size=100m inactive=30m;

# SSR HTML varies by locale (<html lang> + every translated string), so the
# cache key must too — otherwise one visitor's Spanish page is served to
# everyone until it expires. Mirrors the precedence in app/i18n/i18n.server.ts:
# searchParams -> cookie -> Accept-Language -> fallback 'en'.
# The df-locale cookie holds a base64 JSON string: "en" -> ImVuIg==, "es" -> ImVzIg==.
map $arg_lang $df_locale_query {
    default   "";
    "~*^en$"  "en";
    "~*^es$"  "es";
}
# Matched off $http_cookie, not $cookie_df_locale: nginx does not translate
# dashes for $cookie_*, so $cookie_df_locale would look for "df_locale".
map $http_cookie $df_locale_cookie {
    default                          "";
    "~(?:^|;\s*)df-locale=ImVuIg"    "en";
    "~(?:^|;\s*)df-locale=ImVzIg"    "es";
}
map $http_accept_language $df_locale_header {
    default   "en";
    "~*^es"   "es";
}
map "$df_locale_query:$df_locale_cookie:$df_locale_header" $df_locale {
    default     "en";
    "~^en:"     "en";
    "~^es:"     "es";
    "~^:en:"    "en";
    "~^:es:"    "es";
    "~^::en$"   "en";
    "~^::es$"   "es";
}

upstream backend_server {
    server backend:8000;
}

upstream frontend_server {
    server frontend:3000;
}
server {
    listen 80 ;
    location / {
        return 301 https://$host$request_uri;
    }
    server_name ${DOMAIN} www.${DOMAIN};



    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${DOMAIN} www.${DOMAIN};
    client_max_body_size 100M;


    ssl_certificate /etc/letsencrypt/live/dota.kettle.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dota.kettle.sh/privkey.pem;

    location ~ /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    location /complete {
        proxy_pass http://backend_server/complete;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

    }
    location /api {
        proxy_pass http://backend_server/api;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # WebSocket connections on /api/ need longer timeouts to avoid
        # Nginx killing idle connections (default is 60s)
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # Discord bot interactions endpoint (for ngrok tunneling)
    location /discord/ {
        proxy_pass http://backend_server/api/discord/;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

   location /login {
        proxy_pass http://backend_server;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

   location /static {
        proxy_pass http://backend_server;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /admin {
        proxy_pass http://backend_server;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    location /logout {
        proxy_pass http://backend_server;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
    }
    location /disconnect {
        proxy_pass http://backend_server;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
    }

    location /ws {
        proxy_pass http://frontend_server;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 360s;
        proxy_read_timeout 360s;
    }

    # Vite dev-server HMR WebSocket. The Vite client opens
    # wss://<host>/__vite_hmr (configured via server.hmr.path in
    # vite.config.ts). nginx upgrades and proxies straight to the
    # frontend container.
    location /__vite_hmr {
        proxy_pass http://frontend_server/__vite_hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    # Static assets (Vite content-hashed) — long cache, bypass SSR cache
    location /assets/ {
        proxy_pass http://frontend_server/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router / Vite internal requests — never cache
    location ~ ^/(__manifest|__data|@fs|@vite|@id|node_modules|app) {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # All other frontend routes — SSR with nginx cache
    location / {
        proxy_cache ssr_cache;
        proxy_cache_valid 200 10m;
        # Excludes query strings except ?lang= — meta tags don't vary by params,
        # but the rendered locale does. $df_locale collapses cookie/header/query
        # to one of two values, so this is at most 2 entries per URL.
        proxy_cache_key "$uri|$df_locale";
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://frontend_server/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


}
